<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for contacting Bea Claire Sollesta.">
    <title>Thank You | Bea Claire Sollesta</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #121212;
            --surface: #1b1b1b;
            --text: #f4f1eb;
            --muted: #a8a49d;
            --accent: #d9f36a;
            --border: rgba(255,255,255,.1);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
            background: var(--background);
            color: var(--text);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        main {
            width: min(100%, 620px);
        }

        .thank-you-card {
            padding: clamp(28px, 6vw, 56px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.4rem, 8vw, 4.5rem);
            line-height: .98;
            letter-spacing: -.04em;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .project-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--accent);
            color: #121212;
            font-weight: 700;
            text-decoration: none;
        }

        .project-cta:hover,
        .project-cta:focus-visible {
            background: #efffa4;
        }
    </style>
</head>
<body>
    <main>
        <section class="thank-you-card" aria-labelledby="thank-you-title">
            <p class="eyebrow">Message received</p>
            <h1 id="thank-you-title">Thank you for reaching out.</h1>
            <p>Your message has been sent successfully. I will get back to you as soon as possible.</p>
            <a class="project-cta" href="index.html">Return to portfolio</a>
        </section>
    </main>
</body>
</html>
